<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Warrants Checklist LIFF</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #FFF3D6;
    }

    .box {

      width: calc(100% - 40px);
      max-width: 420px;

      padding: 30px 20px;

      box-sizing: border-box;

      background: white;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {

      margin-top: 0;

      color: #800020;
    }

    p {

      color: #555;

      line-height: 1.6;
    }

    .success {

      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: #E8F5E9;

      color: #2E7D32;

      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>📤 Warrants Checklist</h2>

    <p>
      LIFF Static Hosting
    </p>

    <div class="success">

      ✅ GitHub Pages ทำงานแล้ว

    </div>

  </div>

</body>

</html>
