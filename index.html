<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Warrants Checklist Share</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      margin: 0;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: #FFF3D6;

      color: #333;
    }

    .box {
      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;

      color: #800020;

      text-align: center;
    }

    #status {
      margin-top: 10px;

      font-size: 14px;

      color: #555;

      white-space: pre-line;

      line-height: 1.7;

      word-break: break-word;

      text-align: center;
    }

    #preview {
      display: none;

      margin-top: 20px;
    }

    #personImage {
      display: none;

      width: 100%;

      max-height: 350px;

      object-fit: contain;

      border-radius: 12px;

      background: #f5f5f5;

      margin-bottom: 15px;
    }

    #personText {
      white-space: pre-line;

      font-size: 14px;

      line-height: 1.7;

      word-break: break-word;

      background: #FFF8E8;

      padding: 15px;

      border-radius: 10px;

      box-sizing: border-box;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 15px;

      border: none;

      border-radius: 10px;

      background: #800020;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .error {
      color: #b00020 !important;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>📤 แชร์ข้อมูลบุคคล</h2>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>


    <div id="preview">

      <img
        id="personImage"
        alt="รูปบุคคล"
      >

      <div id="personText"></div>

      <button
        id="shareButton"
        disabled
      >
        📤 แชร์
      </button>

    </div>

  </div>


  <script>

    // ============================================================
    // CONFIG
    // ============================================================

    const LIFF_ID =
      '2011666291-rYHeeTHP';


    const API_URL =
      'https://script.google.com/macros/s/AKfycbxBRjY7-cpAmIVQR8-Fv6FhDCj45T8uerfGQZ7jPyttsoteLV_kz-NqC6_5UwNLnso/exec';


    // ============================================================
    // ELEMENTS
    // ============================================================

    const statusElement =
      document.getElementById('status');

    const previewElement =
      document.getElementById('preview');

    const personImage =
      document.getElementById('personImage');

    const personText =
      document.getElementById('personText');

    const shareButton =
      document.getElementById('shareButton');


    // ============================================================
    // อ่าน Token จาก URL
    // ============================================================

    function getShareToken() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get('token') || '';

    }


    function buildShareText(data) {
    
      let reply = '';
    
      // จำนวนข้อมูล
      const matchedCount =
        data.matchedCount || 1;
    
      reply +=
        '🔎 พบข้อมูลจำนวน ' +
        matchedCount +
        ' แถว\n';
    
      reply +=
        '━━━━━━━━━━━━━━\n';
    
      // ชื่อ Sheet / แถว
      if (
        data.sheetName ||
        data.rowNumber
      ) {
    
        reply +=
          '📄 ' +
          (data.sheetName || '') +
          ' / แถวที่ ' +
          (data.rowNumber || '') +
          '\n';
    
      }
    
      reply +=
        '━━━━━━━━━━━━━━\n\n';
    
    
      // =========================
      // ข้อมูลบุคคล
      // =========================
    
      if (
        data.suspectName &&
        String(data.suspectName).trim() !== ''
      ) {
    
        reply +=
          '👤 ชื่อ-สกุล : ' +
          data.suspectName +
          '\n';
    
      }
    
      if (
        data.idCardNumber &&
        String(data.idCardNumber).trim() !== ''
      ) {
    
        reply +=
          '🪪 เลขบัตร/Pass : ' +
          data.idCardNumber +
          '\n';
    
      }
    
      if (
        data.address &&
        String(data.address).trim() !== ''
      ) {
    
        reply +=
          '🏠 ที่อยู่ : ' +
          data.address +
          '\n';
    
      }
    
      reply += '\n';
    
    
      // =========================
      // ข้อมูลหมายจับ
      // =========================
    
      if (
        data.policeStation &&
        String(data.policeStation).trim() !== ''
      ) {
    
        reply +=
          '🚨 หมายจับ : ' +
          data.policeStation +
          '\n';
    
      }
    
      if (
        data.warrantNumber &&
        String(data.warrantNumber).trim() !== ''
      ) {
    
        reply +=
          '🔢 เลขที่หมายจับ : ' +
          data.warrantNumber +
          '\n';
    
      }
    
      if (
        data.offense &&
        String(data.offense).trim() !== ''
      ) {
    
        reply +=
          '⚖️ ความผิดฐาน : ' +
          data.offense +
          '\n';
    
      }
    
      if (
        data.criminalCaseNumber &&
        String(data.criminalCaseNumber).trim() !== ''
      ) {
    
        reply +=
          '📁 เลขคดีที่ : ' +
          data.criminalCaseNumber +
          '\n';
    
      }
    
      reply += '\n';
    
    
      // =========================
      // อายุความ / เงินประกัน
      // =========================
    
      if (
        data.expiration &&
        String(data.expiration).trim() !== ''
      ) {
    
        reply +=
          '📅 หมดอายุความ : ' +
          data.expiration +
          '\n';
    
      }
    
      if (
        data.remainingTime &&
        String(data.remainingTime).trim() !== ''
      ) {
    
        reply +=
          '⏳ เหลือเวลา : ' +
          data.remainingTime +
          '\n';
    
      }
    
      if (
        data.bailAmount &&
        String(data.bailAmount).trim() !== ''
      ) {
    
        reply +=
          '💰 เงินประกันศาล : ' +
          data.bailAmount +
          ' บาท\n';
    
      }
    
      reply += '\n';
    
    
      // =========================
      // สถานะ
      // =========================
    
      if (
        data.status &&
        String(data.status).trim() !== ''
      ) {
    
        const statusEmoji =
          data.statusEmoji || '⚪';
    
        reply +=
          statusEmoji +
          ' สถานะ : ' +
          data.status +
          '\n';
    
      }
    
    
      // =========================
      // หมายเหตุ
      // =========================
    
      if (
        data.note &&
        String(data.note).trim() !== ''
      ) {
    
        reply +=
          '⚠️ หมายเหตุ : ' +
          data.note +
          '\n';
    
      }
    
    
      // =========================
      // ไฟล์หมายจับ
      // =========================
    
      if (
        data.warrantFileLink &&
        String(data.warrantFileLink).trim() !== ''
      ) {
    
        reply +=
          '\n👀 ดูไฟล์หมายจับ :\n' +
          data.warrantFileLink +
          '\n';
    
      }
    
    
      return reply.trim();
    
    }


    // ============================================================
    // โหลดข้อมูลจาก Apps Script API
    // ============================================================

    async function loadPersonData(token) {

      if (!token) {

        throw new Error(
          'ไม่พบ Share Token'
        );

      }


      statusElement.textContent =
        '⏳ กำลังตรวจสอบ Token...';


      const url =
        API_URL +
        '?api=share_person&token=' +
        encodeURIComponent(token);


      const response =
        await fetch(url, {
          method: 'GET'
        });


      if (!response.ok) {

        throw new Error(
          'API ตอบกลับ HTTP ' +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.message ||
          'ไม่สามารถอ่านข้อมูลบุคคลได้'
        );

      }


      return data.data;

    }


    // ============================================================
    // แสดงข้อมูล Preview
    // ============================================================

    function showPersonData(data) {

      const shareText =
        buildShareText(data);


      personText.textContent =
        shareText;


      if (data.imageUrl) {

        personImage.src =
          data.imageUrl;

        personImage.style.display =
          'block';

      } else {

        personImage.style.display =
          'none';

      }


      previewElement.style.display =
        'block';


      shareButton.disabled =
        false;


      statusElement.textContent =
        '✅ ตรวจสอบข้อมูลเรียบร้อย\n' +
        'ตรวจสอบข้อมูลก่อนกดแชร์';

    }


    // ============================================================
    // แชร์ข้อมูลผ่าน Share Target Picker
    // ============================================================

    async function sharePersonData(data) {

      try {

        if (
          !liff.isApiAvailable(
            'shareTargetPicker'
          )
        ) {

          throw new Error(
            'Share Target Picker ไม่พร้อมใช้งาน'
          );

        }


        const shareText =
          buildShareText(data);


        const messages = [];


        // --------------------------------------------------------
        // รูปภาพ
        // --------------------------------------------------------

        if (data.imageUrl) {

          messages.push({

            type: 'image',

            originalContentUrl:
              data.imageUrl,

            previewImageUrl:
              data.imageUrl

          });

        }


        // --------------------------------------------------------
        // ข้อความ
        // --------------------------------------------------------

        messages.push({

          type: 'text',

          text: shareText

        });


        statusElement.textContent =
          '⏳ กำลังเปิดหน้าต่างเลือกผู้รับ...';


        shareButton.disabled =
          true;


        await liff.shareTargetPicker(
          messages
        );


        statusElement.textContent =
          '✅ แชร์ข้อมูลเรียบร้อยแล้ว';


        // ปิด LIFF หลังแชร์สำเร็จ
        setTimeout(() => {

          try {

            liff.closeWindow();

          } catch (error) {

            console.log(
              'closeWindow error:',
              error
            );

          }

        }, 800);


      } catch (error) {

        console.error(
          'SHARE ERROR:',
          error
        );


        statusElement.textContent =
          '❌ แชร์ข้อมูลไม่สำเร็จ\n\n' +
          (
            error.message ||
            String(error)
          );


        shareButton.disabled =
          false;

      }

    }


    // ============================================================
    // Event ปุ่ม Share
    // ============================================================

    shareButton.addEventListener(
      'click',
      async function() {

        if (!window.personData) {

          return;

        }


        await sharePersonData(
          window.personData
        );

      }
    );


    // ============================================================
    // INIT LIFF
    // ============================================================

    async function initLIFF() {

      try {

        statusElement.textContent =
          '⏳ กำลังเชื่อมต่อ LINE...';


        await liff.init({

          liffId:
            LIFF_ID

        });


        // --------------------------------------------------------
        // ตรวจสอบ Login
        // --------------------------------------------------------

        if (!liff.isLoggedIn()) {

          statusElement.textContent =
            '⏳ กำลังเข้าสู่ระบบ LINE...';

          liff.login();

          return;

        }


        // --------------------------------------------------------
        // ตรวจสอบ Share Target Picker
        // --------------------------------------------------------

        if (
          !liff.isApiAvailable(
            'shareTargetPicker'
          )
        ) {

          throw new Error(
            'Share Target Picker ไม่พร้อมใช้งานบนอุปกรณ์นี้'
          );

        }


        // --------------------------------------------------------
        // อ่าน Token
        // --------------------------------------------------------

        const token =
          getShareToken();


        // --------------------------------------------------------
        // เรียก API
        // --------------------------------------------------------

        const data =
          await loadPersonData(
            token
          );


        // เก็บข้อมูลไว้สำหรับปุ่ม Share
        window.personData =
          data;


        // --------------------------------------------------------
        // แสดง Preview
        // --------------------------------------------------------

        showPersonData(
          data
        );


      } catch (error) {

        console.error(
          'LIFF ERROR:',
          error
        );


        statusElement.classList.add(
          'error'
        );


        statusElement.textContent =
          '❌ ไม่สามารถโหลดข้อมูลได้\n\n' +
          (
            error.message ||
            String(error)
          );

      }

    }


    // ============================================================
    // เริ่มระบบ
    // ============================================================

    initLIFF();

  </script>

</body>

</html>
