<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Warrants Checklist Share</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      margin: 0;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: #FFF3D6;

      color: #333;
    }

    .box {
      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;

      color: #800020;

      text-align: center;
    }

    #status {
      margin-top: 10px;

      font-size: 14px;

      color: #555;

      white-space: pre-line;

      line-height: 1.7;

      word-break: break-word;

      text-align: center;
    }

    #preview {
      display: none;

      margin-top: 20px;
    }

    #personImage {
      display: none;

      width: 100%;

      max-height: 350px;

      object-fit: contain;

      border-radius: 12px;

      background: #f5f5f5;

      margin-bottom: 15px;
    }

    #personText {
      white-space: pre-line;

      font-size: 14px;

      line-height: 1.7;

      word-break: break-word;

      background: #FFF8E8;

      padding: 15px;

      border-radius: 10px;

      box-sizing: border-box;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 15px;

      border: none;

      border-radius: 10px;

      background: #800020;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .error {
      color: #b00020 !important;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>📤 แชร์ข้อมูลบุคคล</h2>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>


    <div id="preview">

      <img
        id="personImage"
        alt="รูปบุคคล"
      >

      <div id="personText"></div>

      <button
        id="shareButton"
        disabled
      >
        📤 แชร์
      </button>

    </div>

  </div>


  <script>

    // ============================================================
    // CONFIG
    // ============================================================

    const LIFF_ID =
      '2011666291-rYHeeTHP';


    const API_URL =
      'https://script.google.com/macros/s/AKfycbxBRjY7-cpAmIVQR8-Fv6FhDCj45T8uerfGQZ7jPyttsoteLV_kz-NqC6_5UwNLnso/exec';


    // ============================================================
    // ELEMENTS
    // ============================================================

    const statusElement =
      document.getElementById('status');

    const previewElement =
      document.getElementById('preview');

    const personImage =
      document.getElementById('personImage');

    const personText =
      document.getElementById('personText');

    const shareButton =
      document.getElementById('shareButton');


    // ============================================================
    // อ่าน Token จาก URL
    // ============================================================

    function getShareToken() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get('token') || '';

    }


    // ============================================================
    // โหลดข้อมูลจาก Apps Script API
    // ============================================================

    async function loadPersonData(token) {

      if (!token) {

        throw new Error(
          'ไม่พบ Share Token'
        );

      }


      statusElement.textContent =
        '⏳ กำลังตรวจสอบข้อมูล...';


      const url =
        API_URL +
        '?api=share_person&token=' +
        encodeURIComponent(token);


      const response =
        await fetch(url, {
          method: 'GET'
        });


      if (!response.ok) {

        throw new Error(
          'API ตอบกลับ HTTP ' +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.message ||
          'ไม่สามารถอ่านข้อมูลบุคคลได้'
        );

      }


      return data.data;

    }


    // ============================================================
    // แสดงข้อมูล Preview
    // ============================================================

    function showPersonData(data) {

      const shareText =
        buildShareText(data);


      personText.textContent =
        shareText;


      if (data.imageUrl) {

        personImage.src =
          data.imageUrl;

        personImage.style.display =
          'block';

      } else {

        personImage.style.display =
          'none';

      }


      previewElement.style.display =
        'block';


      shareButton.disabled =
        false;


      statusElement.textContent =
        '✅ ตรวจสอบข้อมูลเรียบร้อย\n' +
        'ตรวจสอบข้อมูลก่อนกดแชร์';

    }


    async function sharePersonData(data) {
      try {
        if (!liff.isApiAvailable('shareTargetPicker')) {
          throw new Error('Share Target Picker ไม่พร้อมใช้งาน');
        }
    
        const flexMessage = buildShareFlex(data);
    
        statusElement.textContent =
          '⏳ กำลังเปิดหน้าต่างเลือกผู้รับ...';
    
        shareButton.disabled = true;
    
        await liff.shareTargetPicker([flexMessage]);
    
        statusElement.textContent =
          '✅ แชร์ข้อมูลเรียบร้อยแล้ว';
    
        setTimeout(() => {
          try {
            liff.closeWindow();
          } catch (error) {
            console.log('closeWindow error:', error);
          }
        }, 800);
    
      } catch (error) {
        console.error('SHARE ERROR:', error);
    
        statusElement.textContent =
          '❌ แชร์ข้อมูลไม่สำเร็จ\n\n' +
          (error.message || String(error));
    
        shareButton.disabled = false;
      }
    }

    function buildShareText(data) {

  let text = '';

  text +=
    '🔎 พบข้อมูลจำนวน ' +
    (data.matchedCount || 1) +
    ' แถว\n';

  text += '━━━━━━━━━━━━━━\n';

  text +=
    '📄 ' +
    (data.sheetName || '') +
    ' / แถวที่ ' +
    (data.rowNumber || '') +
    '\n';

  text += '━━━━━━━━━━━━━━\n\n';

  if (data.suspectName) {
    text +=
      '👤 ชื่อ-สกุล : ' +
      data.suspectName +
      '\n';
  }

  if (data.idCardNumber) {
    text +=
      '🪪 เลขบัตร/Pass : ' +
      data.idCardNumber +
      '\n';
  }

  if (data.address) {
    text +=
      '🏠 ที่อยู่ : ' +
      data.address +
      '\n';
  }

  text += '\n';

  if (data.policeStation) {
    text +=
      '🚨 หมายจับ : ' +
      data.policeStation +
      '\n';
  }

  if (data.warrantNumber) {
    text +=
      '🔢 เลขที่หมายจับ : ' +
      data.warrantNumber +
      '\n';
  }

  if (data.offense) {
    text +=
      '⚖️ ความผิดฐาน : ' +
      data.offense +
      '\n';
  }

  if (data.criminalCaseNumber) {
    text +=
      '📁 เลขคดีที่ : ' +
      data.criminalCaseNumber +
      '\n';
  }

  text += '\n';

  if (data.expiration) {
    text +=
      '📅 หมดอายุความ : ' +
      data.expiration +
      '\n';
  }

  if (data.remainingTime) {
    text +=
      '⏳ เหลือเวลา : ' +
      data.remainingTime +
      '\n';
  }

  if (data.bailAmount) {
    text +=
      '💰 เงินประกันศาล : ' +
      data.bailAmount +
      ' บาท\n';
  }

  text += '\n';

  if (data.status) {
    text +=
      (data.statusEmoji || '⚪') +
      ' สถานะ : ' +
      data.status +
      '\n';
  }

  text +=
    '⭐ ฐานข้อมูล : ' +
    (
      data.databaseChecked
        ? '✅ตรวจพบ'
        : '❌ตรวจไม่พบ'
    ) +
    '\n';

  if (data.note) {
    text +=
      '⚠️ หมายเหตุ : ' +
      data.note +
      '\n';
  }

  if (data.warrantFileLink) {
    text +=
      '\n👀 ดูไฟล์หมายจับ :\n' +
      data.warrantFileLink +
      '\n';
  }

  return text;
}

function buildShareFlex(data) {

  // ==========================================================
  // กล่องข้อมูลบุคคล
  // ==========================================================

  const personBox = {

    type: 'box',

    layout: 'vertical',

    spacing: 'sm',

    contents: []

  };


  if (data.suspectName) {

    personBox.contents.push({

      type: 'text',

      text:
        '👤 ชื่อ-สกุล : ' +
        data.suspectName,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.idCardNumber) {

    personBox.contents.push({

      type: 'text',

      text:
        '🪪 เลขบัตร/Pass : ' +
        data.idCardNumber,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.address) {

    personBox.contents.push({

      type: 'text',

      text:
        '🏠 ที่อยู่ : ' +
        data.address,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  // ==========================================================
  // กล่องข้อมูลหมายจับ
  // ==========================================================

  const warrantBox = {

    type: 'box',

    layout: 'vertical',

    spacing: 'sm',

    margin: 'lg',

    contents: []

  };


  if (data.policeStation) {

    warrantBox.contents.push({

      type: 'text',

      text:
        '🚨 หมายจับ : ' +
        data.policeStation,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.warrantNumber) {

    warrantBox.contents.push({

      type: 'text',

      text:
        '🔢 เลขที่หมายจับ : ' +
        data.warrantNumber,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.offense) {

    warrantBox.contents.push({

      type: 'text',

      text:
        '⚖️ ความผิดฐาน : ' +
        data.offense,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.criminalCaseNumber) {

    warrantBox.contents.push({

      type: 'text',

      text:
        '📁 เลขคดีที่ : ' +
        data.criminalCaseNumber,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  // ==========================================================
  // กล่องอายุความ / เงินประกัน
  // ==========================================================

  const expirationBox = {

    type: 'box',

    layout: 'vertical',

    spacing: 'sm',

    margin: 'lg',

    contents: []

  };


  if (data.expiration) {

    expirationBox.contents.push({

      type: 'text',

      text:
        '📅 หมดอายุความ : ' +
        data.expiration,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.remainingTime) {

    expirationBox.contents.push({

      type: 'text',

      text:
        '⏳ เหลือเวลา : ' +
        data.remainingTime,

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  if (data.bailAmount) {

    expirationBox.contents.push({

      type: 'text',

      text:
        '💰 เงินประกันศาล : ' +
        data.bailAmount +
        ' บาท',

      size: 'sm',

      color: '#333333',

      wrap: true

    });

  }


  // ==========================================================
  // กล่องสถานะ + Column X
  // ==========================================================

  const statusBox = {

    type: 'box',

    layout: 'vertical',

    spacing: 'sm',

    margin: 'lg',

    contents: []

  };


  if (data.status) {

    statusBox.contents.push({

      type: 'text',

      text:
        (data.statusEmoji || '⚪') +
        ' สถานะ : ' +
        data.status,

      size: 'sm',

      weight: 'bold',

      color: '#333333',

      wrap: true

    });

  }


  statusBox.contents.push({

    type: 'text',

    text:
      '⭐ ฐานข้อมูล : ' +
      (
        data.databaseChecked
          ? '✅ตรวจพบ'
          : '❌ตรวจไม่พบ'
      ),

    size: 'sm',

    weight: 'bold',

    color: '#333333',

    wrap: true

  });


  // ==========================================================
  // หมายเหตุ
  // ==========================================================

  const noteBox = {

    type: 'box',

    layout: 'vertical',

    margin: 'md',

    contents: []

  };


  if (data.note) {

    noteBox.contents.push({

      type: 'text',

      text:
        '⚠️ หมายเหตุ : ' +
        data.note,

      size: 'sm',

      weight: 'bold',

      color: '#333333',

      wrap: true

    });

  }


  // ==========================================================
  // ลิงก์ไฟล์หมายจับ
  // ==========================================================

  const fileBox = {

    type: 'box',

    layout: 'vertical',

    margin: 'lg',

    spacing: 'sm',

    contents: []

  };


  if (data.warrantFileLink) {

    fileBox.contents.push({

      type: 'separator',

      color: '#800020'

    });


    fileBox.contents.push({

      type: 'text',

      text:
        '👀 ดูไฟล์หมายจับ :',

      size: 'sm',

      weight: 'bold',

      color: '#800020',

      margin: 'sm'

    });


    fileBox.contents.push({

      type: 'text',

      text:
        data.warrantFileLink,

      size: 'xs',

      color: '#0066CC',

      wrap: true,

      action: {

        type: 'uri',

        uri:
          data.warrantFileLink

      }

    });

  }


  // ==========================================================
  // BODY
  // ==========================================================

  const bodyContents = [];


  bodyContents.push({

    type: 'text',

    text:
      '🔎 พบข้อมูลจำนวน ' +
      (data.matchedCount || 1) +
      ' แถว',

    size: 'md',

    weight: 'bold',

    color: '#800020'

  });


  bodyContents.push({

    type: 'separator',

    margin: 'md',

    color: '#800020'

  });


  bodyContents.push({

    type: 'text',

    text:
      '📄 ' +
      (data.sheetName || '') +
      ' / แถวที่ ' +
      (data.rowNumber || ''),

    size: 'sm',

    weight: 'bold', 

    color: '#333333',

    margin: 'md',

    wrap: true

  });


  bodyContents.push({

    type: 'separator',

    margin: 'md',

    color: '#800020'

  });


  if (
    personBox.contents.length > 0
  ) {
  
    bodyContents.push(
      personBox
    );
  }


  bodyContents.push({

    type: 'separator',

    margin: 'lg',

    color: '#800020'

  });


  if (
    warrantBox.contents.length > 0
  ) {
    bodyContents.push(
      warrantBox
    );
  }
  
  if (
    expirationBox.contents.length > 0
  ) {
    bodyContents.push(
      expirationBox
    );
  }
  
  bodyContents.push({
    type: 'separator',
    margin: 'lg',
    color: '#800020'
  });
  
  bodyContents.push(
    statusBox
  );


  if (
    noteBox.contents.length > 0
  ) {

    bodyContents.push(
      noteBox
    );

  }


  if (
    fileBox.contents.length > 0
  ) {

    bodyContents.push(
      fileBox
    );

  }


  // ==========================================================
  // FLEX BUBBLE
  // ==========================================================

  const bubble = {

    type: 'bubble',

    size: 'mega',

    body: {

      type: 'box',

      layout: 'vertical',

      backgroundColor: '#FFF3D6',

      paddingAll: '18px',

      spacing: 'sm',

      contents:
        bodyContents

    }

  };


  // ==========================================================
  // รูปใบหน้า
  // ==========================================================

  if (data.imageUrl) {

    bubble.hero = {

      type: 'image',

      url:
        data.imageUrl,

      size: 'full',

      aspectRatio: '4:3',

      aspectMode: 'fit'

    };

  }


  // ==========================================================
  // FLEX MESSAGE
  // ==========================================================

  return {

    type: 'flex',

    altText:
      'ข้อมูลบุคคล ' +
      (data.suspectName || ''),

    contents:
      bubble

  };

}
    
    // ============================================================
    // Event ปุ่ม Share
    // ============================================================

    shareButton.addEventListener(
      'click',
      async function() {

        if (!window.personData) {

          return;

        }


        await sharePersonData(
          window.personData
        );

      }
    );


    // ============================================================
    // INIT LIFF
    // ============================================================

    async function initLIFF() {

      try {

        statusElement.textContent =
          '⏳ กำลังเชื่อมต่อ LINE...';


        await liff.init({

          liffId:
            LIFF_ID

        });


        // --------------------------------------------------------
        // ตรวจสอบ Login
        // --------------------------------------------------------

        if (!liff.isLoggedIn()) {

          statusElement.textContent =
            '⏳ กำลังเข้าสู่ระบบ LINE...';

          liff.login();

          return;

        }


        // --------------------------------------------------------
        // ตรวจสอบ Share Target Picker
        // --------------------------------------------------------

        if (
          !liff.isApiAvailable(
            'shareTargetPicker'
          )
        ) {

          throw new Error(
            'Share Target Picker ไม่พร้อมใช้งานบนอุปกรณ์นี้'
          );

        }


        // --------------------------------------------------------
        // อ่าน Token
        // --------------------------------------------------------

        const token =
          getShareToken();


        // --------------------------------------------------------
        // เรียก API
        // --------------------------------------------------------

        const data =
          await loadPersonData(
            token
          );


        // เก็บข้อมูลไว้สำหรับปุ่ม Share
        window.personData =
          data;


        // --------------------------------------------------------
        // แสดง Preview
        // --------------------------------------------------------

        showPersonData(
          data
        );


      } catch (error) {

        console.error(
          'LIFF ERROR:',
          error
        );


        statusElement.classList.add(
          'error'
        );


        statusElement.textContent =
          '❌ ไม่สามารถโหลดข้อมูลได้\n\n' +
          (
            error.message ||
            String(error)
          );

      }

    }


    // ============================================================
    // เริ่มระบบ
    // ============================================================

    initLIFF();

  </script>

</body>

</html>
